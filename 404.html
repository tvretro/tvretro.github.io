<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch the YouTube video on "Retro TV"</title>
    <style>
      :root,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #080a0c;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .viewport-home-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 52px;
        height: 52px;
        background: rgba(10, 12, 16, 0.7);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(4px);
      }

      .viewport-home-btn:hover {
        background: rgba(230, 57, 70, 0.9);
        border-color: rgba(255, 255, 255, 0.6);
        transform: scale(1.08) translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      }

      .viewport-home-btn svg {
        width: 24px;
        height: 24px;
      }

      .interactive-dial {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .interactive-dial.dragging {
        cursor: grabbing;
      }

      .dial-hit-area {
        pointer-events: all;
      }

      #tvWoodOuter, #tvWoodGrain, #tvWoodVignette, #tvWoodBorder, 
      #tvWoodStroke1, #tvWoodStroke2, #woodGlare,
      #innerBlackCase, #controlPanel rect[fill="#333333"] {
        cursor: help;
      }
      #polishedSurface, #bezelBottomHitbox {
        touch-action: none;
        cursor: -webkit-grab;
        cursor: grab;
      }
      #polishedSurface.active-rub, #bezelBottomHitbox.active-rub {
        cursor: -webkit-grabbing !important;
        cursor: grabbing !important;
      }
    </style>
  </head>

              player.pauseVideo();
            } else {
              player.playVideo();
            }

        }

      function changeChannel(detentIndex) {
        if (!player || typeof player.loadVideoById !== 'function') return;
 
        if (!hasDialBeenMoved) return;
        const listLength = stationList.length;
        const safeIndex = ((detentIndex % listLength) + listLength) % listLength;

      let activeDial = null;
      let audioContext = null;
      let lastTickAt = 0;
 
      function ensureDialAudio() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          audioContext = new AudioCtx();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume().catch(() => {});
        }
        return audioContext;
      }

      function playMechanicalTick(direction) {
        const ctx = ensureDialAudio();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (now - lastTickAt < 0.015) return;
        lastTickAt = now;
   
        const bufferSize = ctx.sampleRate * 0.05; 
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = buffer;
 
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';

        const freq = direction >= 0 ? 800 : 700;
        filter.frequency.setValueAtTime(freq, now);
        filter.Q.setValueAtTime(1.5, now); 
  
        const gain = ctx.createGain();
   
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.8, now + 0.005); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04); 

        noiseSource.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
     
        noiseSource.start(now);
        noiseSource.stop(now + 0.05);
      }
 
      function dialCenterScreen(element) {
        const ctm = element?.getScreenCTM();
        return ctm ? new DOMPoint(0, 0).matrixTransform(ctm) : null;
      }

      function pointerAngle(element, event) {
        const center = dialCenterScreen(element);
        if (!center) return null;
        return Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
      }

      function angleDelta(from, to) {
        let delta = to - from;
        while (delta > 180) delta -= 360;
        while (delta < -180) delta += 360;
        return delta;
      }

     // --- Area Click Sound ---
        // Wood Sound
        function playWoodKnock() {
          const ctx = ensureDialAudio();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);

          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0, now);
          oscGain.gain.linearRampToValueAtTime(0.25, now + 0.005); // Main tone -> 0.25
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          const bufferSize = ctx.sampleRate * 0.05;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1200, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0, now);
          noiseGain.gain.linearRampToValueAtTime(0.1, now + 0.002);  // Impact tissue -> 0.1
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          osc.start(now);
          noise.start(now);
          osc.stop(now + 0.15);
          noise.stop(now + 0.05);
        }

        // --- Plastic Sound---
        function playPlasticTap() {
          const ctx = ensureDialAudio();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.04);

          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0, now);
          oscGain.gain.linearRampToValueAtTime(0.18, now + 0.001); // Main tone -> 0.18
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          const bufferSize = ctx.sampleRate * 0.02;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1800, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0, now);
          noiseGain.gain.linearRampToValueAtTime(0.04, now + 0.001);  // Impact tissue -> 0.04
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          osc.start(now);
          noise.start(now);
          osc.stop(now + 0.06);
          noise.stop(now + 0.03);
        }

       
        document.getElementById('retroTvSvg').addEventListener('pointerdown', (e) => {
          const target = e.target;
          if (!target) return;
          if (
            target.closest('.interactive-dial') ||
            target.closest('#clickOverlay') ||
            target.closest('#playerObject') ||
            target.tagName.toLowerCase() === 'text' ||
            target.closest('#polishedSurface') ||
            target.closest('#bezelBottomHitbox')
          ) {
            return;
          }
          const isWood = target.closest('#tvWoodOuter, #tvWoodGrain, #tvWoodVignette, #tvWoodBorder, #tvWoodStroke1, #tvWoodStroke2, #woodGlare');
          if (isWood) {
            playWoodKnock();
            return;
          }
          const isPlastic = target.closest('#innerBlackCase, #innerBlackCaseStroke, #controlPanelGroup');
          if (isPlastic) {
            playPlasticTap();
          }
        });
       // --- Area Click Sound

       // --- Bej 
        let rubAudioParams = null;

        function startRubbingSound() {
          const ctx = ensureDialAudio();
          if (!ctx || rubAudioParams) return;
          const now = ctx.currentTime;

          // 1. Kadifemsi / Pürüzsüz Yüzey Sürtünmesi (Hışırtısız Brownian Gürültü)
          const bufferSize = ctx.sampleRate * 2;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let lastOut = 0.0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            // Entegre gürültü (Brownian/Kırmızı gürültü) cızırtıyı tamamen yok eder, ipeksi bir sürtünme hissi verir
            lastOut = (lastOut + (0.02 * white)) / 1.02;
            data[i] = lastOut * 3.5;
          }

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          noise.loop = true;

          // Sürtünme filtresi (Pürüzsüz cilalı yüzey karakteristiği)
          const noiseFilter = ctx.createBiquadFilter();
          noiseFilter.type = 'lowpass';
          noiseFilter.frequency.setValueAtTime(550, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0.001, now);
          noiseGain.gain.linearRampToValueAtTime(0.22, now + 0.08);

          noise.connect(noiseFilter);
          noiseFilter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          // 2. Karbon Fiber Gövde Rezonansı (Tok ve hafif kompozit titreşimi)
          const bodyOsc = ctx.createOscillator();
          bodyOsc.type = 'sine';
          bodyOsc.frequency.setValueAtTime(145, now);

          const bodyGain = ctx.createGain();
          bodyGain.gain.setValueAtTime(0.001, now);
          bodyGain.gain.linearRampToValueAtTime(0.07, now + 0.08);

          bodyOsc.connect(bodyGain);
          bodyGain.connect(ctx.destination);

          // 3. Parlak Cila / Vernik Kayma Tonu (Glossy Glide Tınısı)
          const glossOsc = ctx.createOscillator();
          glossOsc.type = 'triangle';
          glossOsc.frequency.setValueAtTime(620, now);
          // Sürtünme hissi için hafif organik frekans salınımı
          glossOsc.frequency.linearRampToValueAtTime(580, now + 0.3);

          const glossFilter = ctx.createBiquadFilter();
          glossFilter.type = 'bandpass';
          glossFilter.frequency.setValueAtTime(600, now);
          glossFilter.Q.setValueAtTime(3.0, now);

          const glossGain = ctx.createGain();
          glossGain.gain.setValueAtTime(0.001, now);
          glossGain.gain.linearRampToValueAtTime(0.035, now + 0.06);

          glossOsc.connect(glossFilter);
          glossFilter.connect(glossGain);
          glossGain.connect(ctx.destination);

          noise.start(now);
          bodyOsc.start(now);
          glossOsc.start(now);

          rubAudioParams = { noise, noiseGain, bodyOsc, bodyGain, glossOsc, glossGain };
        }

        function stopRubbingSound() {
          if (!rubAudioParams) return;
          const ctx = ensureDialAudio();
          const now = ctx.currentTime;

          // Yumuşak sönümlenme (Fade-Out)
          rubAudioParams.noiseGain.gain.linearRampToValueAtTime(0.0001, now + 0.12);
          rubAudioParams.bodyGain.gain.linearRampToValueAtTime(0.0001, now + 0.12);
          rubAudioParams.glossGain.gain.linearRampToValueAtTime(0.0001, now + 0.12);

          rubAudioParams.noise.stop(now + 0.15);
          rubAudioParams.bodyOsc.stop(now + 0.15);
          rubAudioParams.glossOsc.stop(now + 0.15);

          rubAudioParams = null;
        }
        // Finger End

        
        function renderDial(config, rotation) {
          const transform = `rotate(${rotation})`;
          config.face?.setAttribute('transform', transform);
          config.pointer?.setAttribute('transform', transform);
        }
    
        function animateDialTo(config, target) {
          const start = config.rotation;
          const distance = target - start;
          const duration = 85;
          const startTime = performance.now();

          function frame(now) {
            const p = Math.min(1,
              (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - p, 3);
            renderDial(config, start + distance * eased);
            if (p < 1) {
              requestAnimationFrame(frame);
            }
          }
          requestAnimationFrame(frame);
        }
    
        function beginDialDrag(name, event) {
          const config = dialConfigs[name];
          if (!config?.element) return;
          const angle = pointerAngle(config.element, event);
          if (angle == null) return;

          ensureDialAudio();
          activeDial = {
            name,
            config,
            pointerId: event.pointerId,
            lastPointerAngle: angle,
            rawRotation: config.rotation,
            lastDetent: Math.round(config.rotation / config.step)
          };
          config.element.classList.add('dragging');
          try {
            config.element.setPointerCapture(event.pointerId);
          } catch (_) {}
          event.preventDefault();
        }
    
        function moveDialDrag(event) {
          if (!activeDial || event.pointerId !== activeDial.pointerId) {
            return;
          }
          const {
            config
          } = activeDial;
          const angle = pointerAngle(config.element, event);
          if (angle == null) return;
          const RESISTANCE_FACTOR = 3;
          const rawDelta = angleDelta(activeDial.lastPointerAngle, angle);

          activeDial.rawRotation += (rawDelta / RESISTANCE_FACTOR);
          activeDial.lastPointerAngle = angle;

          const newDetent = Math.round(activeDial.rawRotation / config.step);
          const snappedRotation = newDetent * config.step;
     
          if (newDetent !== activeDial.lastDetent) {
      
          hasDialBeenMoved = true;

          playMechanicalTick(newDetent > activeDial.lastDetent ? 1 : -1);
          changeChannel(newDetent);

          activeDial.lastDetent = newDetent;
        }

        config.rotation = snappedRotation;
        renderDial(config, snappedRotation);
        event.preventDefault();
      }

      // --- Bej

      function endDialDrag(event) {
        if (!activeDial) return;
        if (event?.pointerId != null && event.pointerId !== activeDial.pointerId) {
          return;
        }
        const {
          config
        } = activeDial;
        const target = Math.round(config.rotation / config.step) * config.step;
        config.rotation = target;
        animateDialTo(config, target);
        config.element.classList.remove('dragging');
        try {
          if (event?.pointerId != null) {
            config.element.releasePointerCapture(event.pointerId);
          }
        } catch (_) {}
        activeDial = null;
      }
 
      Object.entries(dialConfigs).forEach(
        ([name, config]) => {
          if (!config.element) return;
          config.element.addEventListener('pointerdown',
            (event) => {
              beginDialDrag(name, event);
            });
          config.element.addEventListener('pointermove', moveDialDrag);
          config.element.addEventListener('pointerup', endDialDrag);
          config.element.addEventListener('pointercancel', endDialDrag);
          config.element.addEventListener('lostpointercapture',
            () => {
              if (activeDial?.name === name) {
                endDialDrag();
              }
            });
        });

      renderDial(dialConfigs.vhf, dialConfigs.vhf.rotation);
      renderDial(dialConfigs.uhf, dialConfigs.uhf.rotation);
    </script>
