    <style>
      :root,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #080a0c;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .viewport-home-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 52px;
        height: 52px;
        background: rgba(10, 12, 16, 0.7);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(4px);
      }

      .viewport-home-btn:hover {
        background: rgba(230, 57, 70, 0.9);
        border-color: rgba(255, 255, 255, 0.6);
        transform: scale(1.08) translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      }

      .viewport-home-btn svg {
        width: 24px;
        height: 24px;
      }

      .interactive-dial {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .interactive-dial.dragging {
        cursor: grabbing;
      }

      .dial-hit-area {
        pointer-events: all;
      }

        <path d="M10 21.5V14.5C10 13.95 10.45 13.5 11 13.5H13C13.55 13.5 14 13.95 14 14.5V21.5" />
        <path d="M18 7.5V3.5C18 3.22 17.78 3 17.5 3H15.5C15.22 3 15 3.22 15 3.5V5" />
      </svg>
    </a>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      let videoId = urlParams.get('v');
      if (!videoId) {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const lastSegment = pathSegments.pop();
        if (lastSegment && !['watch', 'watch.html', 'index.html'].includes(lastSegment)) {
          videoId = lastSegment;
        }
      }
      const PROXY_URL = "https://tvretro-proxy.biserkanla.workers.dev/?url=";
      let player;
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
      window.addEventListener('DOMContentLoaded', async () => {
        if (!videoId) return;
        try {
          const targetVideoUrl = `https://www.youtube.com/watch?v=${videoId}`;
          const response = await fetch(`${PROXY_URL}${encodeURIComponent(targetVideoUrl)}`);
          const data = await response.json();
          if (data.width && data.height) {
            adjustTvSymmetrically(data.width / data.height);
          }
        } catch (err) {
          console.warn("Oran verisi çekilemedi, standart 16:9 uygulanıyor.");
          adjustTvSymmetrically(16 / 9);
        }
      });
      let isFirstInteraction = true;
      window.onYouTubeIframeAPIReady = function() {
        if (!videoId) return;
        player = new YT.Player('ytIframe', {
          videoId: videoId,
          playerVars: {
            'controls': 0,
            'modestbranding': 1,
            'rel': 0,
            'iv_load_policy': 3,
            'cc_load_policy': 0,
            'disablekb': 1,
            'fs': 0,
            'autoplay': 0,
            'mute': 0
          },
          events: {
            'onReady': onPlayerReady,
            'onStateChange': onPlayerStateChange
          }
        });
      };

      function onPlayerReady(event) {
        const clickOverlay = document.getElementById('clickOverlay');
        if (clickOverlay) {
          clickOverlay.addEventListener('click', () => {
            const state = player.getPlayerState();
            if (state === YT.PlayerState.PLAYING || state === YT.PlayerState.BUFFERING) {
              player.pauseVideo();
            } else {
              player.playVideo();
            }
          });
        }
      }

      function onPlayerStateChange(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          try {
            event.target.unloadModule("captions");
            event.target.unloadModule("cc");
          } catch (err) {}
        }
      }

      function adjustTvSymmetrically(ratio) {
        const baseHeight = 369;
        const baseWidth = 519.4;
        let newWidth = baseHeight * ratio;
        newWidth = Math.max(380, Math.min(newWidth, 680));
        const deltaX = newWidth - baseWidth;
        const shift = deltaX / 2;
        const startX = 203.3 - shift;
        document.getElementById('playerObject').setAttribute('x', startX);
        document.getElementById('playerObject').setAttribute('width', newWidth);
        document.getElementById('effectScanlines').setAttribute('x', startX);
        document.getElementById('effectScanlines').setAttribute('width', newWidth);
        document.getElementById('effectCrtGlass').setAttribute('x', startX);
        document.getElementById('effectCrtGlass').setAttribute('width', newWidth);
        document.getElementById('effectOvalStroke').setAttribute('x', startX);
        document.getElementById('effectOvalStroke').setAttribute('width', newWidth);
        document.getElementById('effectInnerLine').setAttribute('x', startX);
        document.getElementById('effectInnerLine').setAttribute('width', newWidth);
        document.getElementById('clickOverlay').setAttribute('x', startX);
        document.getElementById('clickOverlay').setAttribute('width', newWidth);
        document.getElementById('screenCustomClipPath').setAttribute('d', `M ${startX} 542 L ${startX} 195 A 22 22 0 0 1 ${startX + 22} 173 L ${startX + newWidth - 22} 173 A 22 22 0 0 1 ${startX + newWidth} 195 L ${startX + newWidth} 542 Z`);
        document.getElementById('blackScreenBg').setAttribute('d', `M ${startX - 2} 544 L ${startX - 2} 193 A 22 22 0 0 1 ${startX + 20} 171 L ${startX + newWidth - 20} 171 A 22 22 0 0 1 ${startX + newWidth + 2} 193 L ${startX + newWidth + 2} 544 Z`);
        document.getElementById('effectGlare').setAttribute('d', `M ${startX},173 L 487.7,173 L 288.3,542 L ${startX},542 Z`);
        const caseShiftX = 184.3 - shift;
        const caseWidth = 671.4 + deltaX;
        document.getElementById('innerBlackCase').setAttribute('x', caseShiftX);
        document.getElementById('innerBlackCase').setAttribute('width', caseWidth);
        document.getElementById('innerBlackCaseStroke').setAttribute('x', caseShiftX + 2);
        document.getElementById('innerBlackCaseStroke').setAttribute('width', caseWidth - 4);
        document.getElementById('creamBezel').setAttribute('x', startX - 5);
        document.getElementById('creamBezel').setAttribute('width', newWidth + 10);
        document.getElementById('creamBezelStroke').setAttribute('x', startX - 5);
        document.getElementById('creamBezelStroke').setAttribute('width', newWidth + 10);
        document.getElementById('bezelBottomHitbox').setAttribute('x', startX - 5);
        document.getElementById('bezelBottomHitbox').setAttribute('width', newWidth + 10);
        const woodStartX = caseShiftX - 20;
        const woodWidth = caseWidth + 40;
        document.getElementById('tvWoodOuter').setAttribute('x', woodStartX);
        document.getElementById('tvWoodOuter').setAttribute('width', woodWidth);
        document.getElementById('tvWoodGrain').setAttribute('x', woodStartX);
        document.getElementById('tvWoodGrain').setAttribute('width', woodWidth);
        document.getElementById('tvWoodVignette').setAttribute('x', woodStartX);
        document.getElementById('tvWoodVignette').setAttribute('width', woodWidth);
        document.getElementById('tvWoodBorder').setAttribute('x', woodStartX);
        document.getElementById('tvWoodBorder').setAttribute('width', woodWidth);
        document.getElementById('tvWoodStroke1').setAttribute('x', caseShiftX - 5);
        document.getElementById('tvWoodStroke1').setAttribute('width', caseWidth + 10);
        document.getElementById('tvWoodStroke2').setAttribute('x', caseShiftX - 3);
        document.getElementById('tvWoodStroke2').setAttribute('width', caseWidth + 6);
        document.getElementById('woodFrameClipRect').setAttribute('x', woodStartX);
        document.getElementById('woodFrameClipRect').setAttribute('width', woodWidth);
        document.getElementById('woodGlare').setAttribute('d', `M ${woodStartX + 1},475 L 320,136 L 520,136 L ${woodStartX + 1},605 Z`);
        document.getElementById('woodLineTL').setAttribute('x1', woodStartX);
        document.getElementById('woodLineTL').setAttribute('x2', woodStartX + 15);
        document.getElementById('woodLineBL').setAttribute('x1', woodStartX);
        document.getElementById('woodLineBL').setAttribute('x2', woodStartX + 15);
        document.getElementById('woodLineTR').setAttribute('x1', woodStartX + woodWidth);
        document.getElementById('woodLineTR').setAttribute('x2', woodStartX + woodWidth - 15);
        document.getElementById('woodLineBR').setAttribute('x1', woodStartX + woodWidth);
        document.getElementById('woodLineBR').setAttribute('x2', woodStartX + woodWidth - 15);
        document.getElementById('controlPanelGroup').setAttribute('transform', `translate(${shift}, 0)`);
        document.getElementById('tvFeetRight').setAttribute('transform', `translate(${shift}, 0)`);
        document.getElementById('tvFeetLeft').setAttribute('transform', `translate(${-shift}, 0)`);
      }
      // VHF / UHF tuner 
      const dialConfigs = {
        vhf: {
          element: document.getElementById('vhfDial'),
          face: document.getElementById('vhfRotatingFace'),
          pointer: document.getElementById('vhfRotatingPointer'),
          step: 360 / 13,
          rotation: -30
        },
        uhf: {
          element: document.getElementById('uhfDial'),
          face: document.getElementById('uhfRotatingFace'),
          pointer: document.getElementById('uhfRotatingPointer'),
          step: 45,
          rotation: 75
        }
      };
      // Videos
      const stationList = ["vdJthIdDR6w", "IufsocTXfMY", "jx0llzSntd8", "CGj85pVzRJs", "S2ujotDMluo"];
      let hasDialBeenMoved = false;

      function changeChannel(detentIndex) {
        if (!player || typeof player.loadVideoById !== 'function') return;
 
        if (!hasDialBeenMoved) return;
        const listLength = stationList.length;
        const safeIndex = ((detentIndex % listLength) + listLength) % listLength;
 
        try {
          player.loadVideoById(stationList[safeIndex]);
        } catch (e) {
          console.warn("YouTube Player henüz hazır değil.", e);
        }
      }
 
      let activeDial = null;
      let audioContext = null;
      let lastTickAt = 0;
 
      function ensureDialAudio() {
        if (!audioContext) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          audioContext = new AudioCtx();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume().catch(() => {});
        }
        return audioContext;
      }

      function playMechanicalTick(direction) {
        const ctx = ensureDialAudio();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (now - lastTickAt < 0.015) return;
        lastTickAt = now;
   
        const bufferSize = ctx.sampleRate * 0.05; 
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = buffer;
 
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';

        const freq = direction >= 0 ? 800 : 700;
        filter.frequency.setValueAtTime(freq, now);
        filter.Q.setValueAtTime(1.5, now); 
  
        const gain = ctx.createGain();
   
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.8, now + 0.005); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04); 

        noiseSource.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
     
        noiseSource.start(now);
        noiseSource.stop(now + 0.05);
      }
 
      function dialCenterScreen(element) {
        const ctm = element?.getScreenCTM();
        return ctm ? new DOMPoint(0, 0).matrixTransform(ctm) : null;
      }

      function pointerAngle(element, event) {
        const center = dialCenterScreen(element);
        if (!center) return null;
        return Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
      }

      function angleDelta(from, to) {
        let delta = to - from;
        while (delta > 180) delta -= 360;
        while (delta < -180) delta += 360;
        return delta;
      }

     // --- Area Click Sound ---
        // Wood Sound
        function playWoodKnock() {
          const ctx = ensureDialAudio();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.08);

          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0, now);
          oscGain.gain.linearRampToValueAtTime(0.25, now + 0.005); // Main tone -> 0.25
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          const bufferSize = ctx.sampleRate * 0.05;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'lowpass';
          filter.frequency.setValueAtTime(1200, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0, now);
          noiseGain.gain.linearRampToValueAtTime(0.1, now + 0.002);  // Impact tissue -> 0.1
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.03);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          osc.start(now);
          noise.start(now);
          osc.stop(now + 0.15);
          noise.stop(now + 0.05);
        }

        // --- Plastic Sound---
        function playPlasticTap() {
          const ctx = ensureDialAudio();
          if (!ctx) return;
          const now = ctx.currentTime;

          const osc = ctx.createOscillator();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(750, now);
          osc.frequency.exponentialRampToValueAtTime(180, now + 0.04);

          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0, now);
          oscGain.gain.linearRampToValueAtTime(0.18, now + 0.001); // Main tone -> 0.18
          oscGain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          const bufferSize = ctx.sampleRate * 0.02;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
          }
          const noise = ctx.createBufferSource();
          noise.buffer = buffer;

          const filter = ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.setValueAtTime(1800, now);

          const noiseGain = ctx.createGain();
          noiseGain.gain.setValueAtTime(0, now);
          noiseGain.gain.linearRampToValueAtTime(0.04, now + 0.001);  // Impact tissue -> 0.04
          noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

          noise.connect(filter);
          filter.connect(noiseGain);
          noiseGain.connect(ctx.destination);

          osc.start(now);
          noise.start(now);
          osc.stop(now + 0.06);
          noise.stop(now + 0.03);
        }

       
        document.getElementById('retroTvSvg').addEventListener('pointerdown', (e) => {
          const target = e.target;
          if (!target) return;
          if (
            target.closest('.interactive-dial') ||
            target.closest('#clickOverlay') ||
            target.closest('#playerObject') ||
            target.tagName.toLowerCase() === 'text' ||
            target.closest('#polishedSurface')
          ) {
            return;
          }
          const isWood = target.closest('#tvWoodOuter, #tvWoodGrain, #tvWoodVignette, #tvWoodBorder, #tvWoodStroke1, #tvWoodStroke2, #woodGlare');
          if (isWood) {
            playWoodKnock();
            return;
          }
          const isPlastic = target.closest('#innerBlackCase, #innerBlackCaseStroke, #controlPanelGroup');
          if (isPlastic) {
            playPlasticTap();
          }
        });
      // --- Area Click Sound ---

       // --- Parlak Yüzey Sürtünme Sentezleyicisi (Sürekli Çalar) ---
          let rubAudioParams = null;

          function startRubbingSound() {
            const ctx = ensureDialAudio();
            if (!ctx || rubAudioParams) return;
            const now = ctx.currentTime;

            // 1. Zemin Rezonansı (Derin ve hafif titreşim)
            const osc = ctx.createOscillator();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(80, now);

            const oscGain = ctx.createGain();
            oscGain.gain.setValueAtTime(0, now);
            oscGain.gain.linearRampToValueAtTime(0.15, now + 0.1);

            osc.connect(oscGain);
            oscGain.connect(ctx.destination);

            // 2. Sürtünme Hışırtısı (Parlak yüzey hışırtısı - Noise)
            const bufferSize = ctx.sampleRate * 2; // 2 saniyelik buffer (Sürekli döngü için)
            const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) {
              data[i] = (Math.random() * 2 - 1) * 0.4; // Pembe gürültü hissi için genlik düşürüldü
            }

            const noise = ctx.createBufferSource();
            noise.buffer = buffer;
            noise.loop = true; // Basılı tutulduğu sürece kesintisiz tekrar eder

            const filter = ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(350, now); // Orta-pes frekanslara odaklanır
            filter.Q.setValueAtTime(0.4, now);

            const noiseGain = ctx.createGain();
            noiseGain.gain.setValueAtTime(0, now);
            noiseGain.gain.linearRampToValueAtTime(0.25, now + 0.1); // Pürüzsüz giriş

            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(ctx.destination);

            osc.start(now);
            noise.start(now);

            rubAudioParams = { osc, oscGain, noise, noiseGain };
          }

          function stopRubbingSound() {
            if (!rubAudioParams) return;
            const ctx = ensureDialAudio();
            const now = ctx.currentTime;

            // Sesin birden değil, yumuşakça kesilmesi (Fade-Out)
            rubAudioParams.oscGain.gain.linearRampToValueAtTime(0.001, now + 0.15);
            rubAudioParams.noiseGain.gain.linearRampToValueAtTime(0.001, now + 0.15);

            rubAudioParams.osc.stop(now + 0.2);
            rubAudioParams.noise.stop(now + 0.2);

            rubAudioParams = null;
          }

          // --- Parlak Yüzey İçin Doğrudan Event Dinleyiciler ---
          // --- Parlak Yüzey İçin Doğrudan Event Dinleyiciler ---
          const polishedSurfaceElement = document.getElementById('polishedSurface');

          if (polishedSurfaceElement) {
            polishedSurfaceElement.addEventListener('pointerdown', (e) => {
              try { e.target.setPointerCapture(e.pointerId); } catch(err){}
              startRubbingSound();
            });

            polishedSurfaceElement.addEventListener('pointerup', (e) => {
              try { e.target.releasePointerCapture(e.pointerId); } catch(err){}
              stopRubbingSound();
            });
            
            polishedSurfaceElement.addEventListener('pointercancel', stopRubbingSound);
          }

             // Finger
      function renderDial(config, rotation) {
        const transform = `rotate(${rotation})`;
        config.face?.setAttribute('transform', transform);
        config.pointer?.setAttribute('transform', transform);
      }
  
      function animateDialTo(config, target) {
        const start = config.rotation;
        const distance = target - start;
        const duration = 85;
        const startTime = performance.now();

        function frame(now) {
          const p = Math.min(1,
            (now - startTime) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          renderDial(config, start + distance * eased);
          if (p < 1) {
            requestAnimationFrame(frame);
          }
        }
        requestAnimationFrame(frame);
      }
  
      function beginDialDrag(name, event) {
        const config = dialConfigs[name];
        if (!config?.element) return;
        const angle = pointerAngle(config.element, event);
        if (angle == null) return;

        ensureDialAudio();
        activeDial = {
          name,
          config,
          pointerId: event.pointerId,
          lastPointerAngle: angle,
          rawRotation: config.rotation,
          lastDetent: Math.round(config.rotation / config.step)
        };
        config.element.classList.add('dragging');
        try {
          config.element.setPointerCapture(event.pointerId);
        } catch (_) {}
        event.preventDefault();
      }
  
      function moveDialDrag(event) {
        if (!activeDial || event.pointerId !== activeDial.pointerId) {
          return;
        }
        const {
          config
        } = activeDial;
        const angle = pointerAngle(config.element, event);
        if (angle == null) return;
        const RESISTANCE_FACTOR = 3;
        const rawDelta = angleDelta(activeDial.lastPointerAngle, angle);

        activeDial.rawRotation += (rawDelta / RESISTANCE_FACTOR);
        activeDial.lastPointerAngle = angle;

        const newDetent = Math.round(activeDial.rawRotation / config.step);
        const snappedRotation = newDetent * config.step;
   
        if (newDetent !== activeDial.lastDetent) {
    
        hasDialBeenMoved = true;

        playMechanicalTick(newDetent > activeDial.lastDetent ? 1 : -1);
        changeChannel(newDetent);

        activeDial.lastDetent = newDetent;
      }

      config.rotation = snappedRotation;
      renderDial(config, snappedRotation);
      event.preventDefault();
    }
  
      function endDialDrag(event) {
        if (!activeDial) return;
        if (event?.pointerId != null && event.pointerId !== activeDial.pointerId) {
          return;
        }
        const {
          config
        } = activeDial;
        const target = Math.round(config.rotation / config.step) * config.step;
        config.rotation = target;
        animateDialTo(config, target);
        config.element.classList.remove('dragging');
        try {
          if (event?.pointerId != null) {
            config.element.releasePointerCapture(event.pointerId);
          }
        } catch (_) {}
        activeDial = null;
      }
 
      Object.entries(dialConfigs).forEach(
        ([name, config]) => {
          if (!config.element) return;
          config.element.addEventListener('pointerdown',
            (event) => {
              beginDialDrag(name, event);
            });
          config.element.addEventListener('pointermove', moveDialDrag);
          config.element.addEventListener('pointerup', endDialDrag);
          config.element.addEventListener('pointercancel', endDialDrag);
          config.element.addEventListener('lostpointercapture',
            () => {
              if (activeDial?.name === name) {
                endDialDrag();
              }
            });
        });

      renderDial(dialConfigs.vhf, dialConfigs.vhf.rotation);
      renderDial(dialConfigs.uhf, dialConfigs.uhf.rotation);
    </script>
