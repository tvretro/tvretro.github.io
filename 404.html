<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="tv.ico">
    <title>Watch the YouTube video on "Retro TV"</title>
    <style>
      :root,
      body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background-color: #080a0c;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      svg {
        display: block;
        width: 100vw;
        height: 100vh;
      }

      .viewport-home-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 52px;
        height: 52px;
        background: rgba(10, 12, 16, 0.7);
        border: 1.5px solid rgba(255, 255, 255, 0.15);
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(4px);
      }

      .viewport-home-btn:hover {
        background: rgba(230, 57, 70, 0.9);
        border-color: rgba(255, 255, 255, 0.6);
        transform: scale(1.08) translateY(-2px);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      }

      .viewport-home-btn svg {
        width: 24px;
        height: 24px;
      }

      .interactive-dial {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .interactive-dial.dragging {
        cursor: grabbing;
      }

      .dial-hit-area {
        pointer-events: all;
      }

      #powerSwitch, #powerSwitch * {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      #powerSwitch.dragging, #powerSwitch.dragging * {
        cursor: grabbing !important;
      }

      #tvWoodOuter, #tvWoodGrain, #tvWoodVignette, #tvWoodBorder, 
      #tvWoodStroke1, #tvWoodStroke2, #woodGlare,
      #innerBlackCase, #controlPanel rect[fill="#333333"] {
        cursor: help;
      }
      #polishedSurface, #bezelBottomHitbox {
        touch-action: none;
        cursor: -webkit-grab;
        cursor: grab;
      }
      #polishedSurface.active-rub, #bezelBottomHitbox.active-rub {
        cursor: -webkit-grabbing !important;
        cursor: grabbing !important;
      }

      /* Kanal değişiminde eski CRT televizyon parazit efekti */
      #channelTransition {
        opacity: 0;
        pointer-events: none;
        visibility: hidden;
      }

      #channelTransition.active {
        visibility: visible;
        animation: crtChannelChange 680ms steps(2, end) forwards;
      }

      #channelTransition .transitionNoise {
        opacity: 0.86;
      }

      #channelTransition .transitionBlack {
        opacity: 0.18;
      }

      #channelTransition .transitionLines {
        opacity: 0.42;
        mix-blend-mode: screen;
      }

      @keyframes crtChannelChange {
        0% { opacity: 0; }
        8% { opacity: 0.92; }
        18% { opacity: 1; }
        34% { opacity: 0.86; }
        52% { opacity: 1; }
        72% { opacity: 0.72; }
        88% { opacity: 0.34; }
        100% { opacity: 0; visibility: hidden; }
      }
    </style>
  </head>

      function playChannelStaticBurst() {
        const ctx = ensureDialAudio();
        if (!ctx) return;
        const now = ctx.currentTime;
        const duration = 0.22;
        const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * duration));
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          const fade = 1 - (i / bufferSize);
          data[i] = (Math.random() * 2 - 1) * fade;
        }

        const source = ctx.createBufferSource();
        source.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(2100, now);
        filter.Q.setValueAtTime(0.9, now);

        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.13, now + 0.008);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        source.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        source.start(now);
        source.stop(now + duration);
      }

      function startChannelTransition() {

      function ensureDialAudio() {
        if (!audioContext) {

          if (!AudioCtx) return null;
          audioContext = new AudioCtx();
        }
        if (audioContext.state === 'suspended') {
          audioContext.resume().catch(() => {});
        }
        return audioContext;

      function playMechanicalTick(direction) {
        const ctx = ensureDialAudio();
        if (!ctx) return;
        const now = ctx.currentTime;

        if (now - lastTickAt < 0.015) return;
        lastTickAt = now;
   
        const bufferSize = ctx.sampleRate * 0.05; 
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noiseSource = ctx.createBufferSource();
        noiseSource.buffer = buffer;
 
        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';

        const freq = direction >= 0 ? 800 : 700;
        filter.frequency.setValueAtTime(freq, now);
        filter.Q.setValueAtTime(1.5, now); 
  
        const gain = ctx.createGain();
   
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.linearRampToValueAtTime(0.8, now + 0.005); 
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04); 

        noiseSource.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
     
        noiseSource.start(now);
        noiseSource.stop(now + 0.05);
      }
 
      function dialCenterScreen(element) {

      function pointerAngle(element, event) {
        const center = dialCenterScreen(element);
        if (!center) return null;
        return Math.atan2(event.clientY - center.y, event.clientX - center.x) * 180 / Math.PI;
      }

      function angleDelta(from, to) {
        let delta = to - from;
        while (delta > 180) delta -= 360;
        while (delta < -180) delta += 360;
        return delta;

          osc.connect(oscGain);
          oscGain.connect(ctx.destination);

          const bufferSize = ctx.sampleRate * 0.05;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);

          for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;

          filter.type = 'lowpass';

          const noiseGain = ctx.createGain();

          osc.start(now);
          noise.start(now);

        let rubAudio = null;
        let isRubbing = false;
        let lastPointerPos = null;
        let rubFadeTimeout = null;

        function initRubAudio() {
          const ctx = ensureDialAudio();
          if (!ctx) return null;
          if (ctx.state === 'suspended') {
            ctx.resume();
          }
          if (rubAudio) return rubAudio;

          const now = ctx.currentTime;

          // (Master Gain)
          const masterGain = ctx.createGain();
          masterGain.gain.setValueAtTime(0, now);
          masterGain.connect(ctx.destination);

          // 1. Smooth Carbon Friction Texture (Pink Noise)
          const bufferSize = ctx.sampleRate * 2;
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          let b0 = 0, b1 = 0, b2 = 0;
          for (let i = 0; i < bufferSize; i++) {
            const white = Math.random() * 2 - 1;
            b0 = 0.99765 * b0 + white * 0.0990460;
            b1 = 0.96300 * b1 + white * 0.0905860;
            b2 = 0.57000 * b2 + white * 0.534191;
            data[i] = (b0 + b1 + b2 + white * 0.5362) * 0.35;
          }

          const noise = ctx.createBufferSource();
          noise.buffer = buffer;
          noise.loop = true;

          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(450, now);
          filter.Q.setValueAtTime(2.0, now);

          noise.connect(filter);
          filter.connect(masterGain);

          // 2. Carbon Fiber Body Vibration
          const osc = ctx.createOscillator();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(130, now);

          const oscGain = ctx.createGain();
          oscGain.gain.setValueAtTime(0.09, now);

          osc.connect(oscGain);
          oscGain.connect(masterGain);

          noise.start(now);
          osc.start(now);

          rubAudio = { ctx, masterGain, filter, osc, noise };
          return rubAudio;
        }

        function onRubMove(e) {
          if (!isRubbing || !rubAudio) return;
          const ctx = rubAudio.ctx;
          const now = ctx.currentTime;

          if (!lastPointerPos) {
            lastPointerPos = { x: e.clientX, y: e.clientY, time: performance.now() };
            return;
          }

          const dx = e.clientX - lastPointerPos.x;
          const dy = e.clientY - lastPointerPos.y;
          const dt = Math.max(1, performance.now() - lastPointerPos.time);
          const dist = Math.hypot(dx, dy);
          const speed = dist / dt;

          lastPointerPos = { x: e.clientX, y: e.clientY, time: performance.now() };

          if (dist < 1) return;

          
          const targetGain = Math.min(0.25, Math.max(0.05, speed * 0.15));
          const targetFreq = Math.min(900, 350 + speed * 400);

          rubAudio.masterGain.gain.cancelScheduledValues(now);
          rubAudio.masterGain.gain.linearRampToValueAtTime(targetGain, now + 0.02);

          rubAudio.filter.frequency.cancelScheduledValues(now);
          rubAudio.filter.frequency.linearRampToValueAtTime(targetFreq, now + 0.03);

          clearTimeout(rubFadeTimeout);
          rubFadeTimeout = setTimeout(() => {
            if (rubAudio && isRubbing) {
              const stopNow = rubAudio.ctx.currentTime;
              rubAudio.masterGain.gain.linearRampToValueAtTime(0.0001, stopNow + 0.08);
            }
          }, 50);
        }

        function startRubbing(e) {
          isRubbing = true;
          lastPointerPos = { x: e.clientX, y: e.clientY, time: performance.now() };

          document.body.style.cursor = 'grabbing';
          if (e.currentTarget) {
            e.currentTarget.style.cursor = 'grabbing';
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch(err){}
          }

          initRubAudio();
        }

        function stopRubbing(e) {
          if (!isRubbing) return;
          isRubbing = false;
          lastPointerPos = null;
          clearTimeout(rubFadeTimeout);
          document.body.style.cursor = '';
          if (e && e.currentTarget) {
            e.currentTarget.style.cursor = 'grab';
            try { e.currentTarget.releasePointerCapture(e.pointerId); } catch(err){}
          }

          if (rubAudio) {
            const now = rubAudio.ctx.currentTime;
            rubAudio.masterGain.gain.cancelScheduledValues(now);
            rubAudio.masterGain.gain.linearRampToValueAtTime(0.0001, now + 0.08);
            setTimeout(() => {
              if (!isRubbing && rubAudio) {
                try {
                  rubAudio.noise.stop();
                  rubAudio.osc.stop();
                  rubAudio.noise.disconnect();
                  rubAudio.osc.disconnect();
                } catch(err){}
                rubAudio = null;
              }
            }, 100);
          }
        }
        const rubbingSurfaces = [
          document.getElementById('polishedSurface'),
          document.getElementById('bezelBottomHitbox')
        ];

        rubbingSurfaces.forEach(surface => {
          if (surface) {
            surface.style.cursor = 'grab';

            surface.addEventListener('pointerdown', startRubbing);
            surface.addEventListener('pointermove', onRubMove);
            surface.addEventListener('pointerup', stopRubbing);
            surface.addEventListener('pointercancel', stopRubbing);
            surface.addEventListener('lostpointercapture', stopRubbing);
          }
        });
        // Bej End

        // --- Power switch ---
        let isTvPoweredOn = true;
        let powerAnimationToken = 0;
        let activePowerDrag = null;
        const POWER_SWITCH_MIN_X = -4.5;
        const POWER_SWITCH_MAX_X = 4.5;
        const POWER_DRAG_RESISTANCE = 2.4;

        function powerEffectElements() {
          return {
            overlay: document.getElementById('powerOffOverlay'),
            line: document.getElementById('powerOffLine'),
            dot: document.getElementById('powerOffDot')
          };
        }

        function resetPowerEffectOn() {
          const { overlay, line, dot } = powerEffectElements();
          if (overlay) overlay.setAttribute('opacity', '0');
          if (line) {
            // Her açılıştan/kapanıştan önce çizgiyi ekranın güncel tam genişliğine geri kur.
            // Böylece ilk kapanıştan sonra genişliği 3px'e düşmüş halde kalmaz.
            const screen = document.getElementById('effectScanlines');
            const x = parseFloat(screen?.getAttribute('x') || '203.3');
            const width = parseFloat(screen?.getAttribute('width') || '519.4');
            line.setAttribute('x', String(x));
            line.setAttribute('width', String(width));
            line.setAttribute('y', '356.5');
            line.setAttribute('height', '2');
            line.setAttribute('opacity', '0');
          }
          if (dot) {
            const screen = document.getElementById('effectScanlines');
            const x = parseFloat(screen?.getAttribute('x') || '203.3');
            const width = parseFloat(screen?.getAttribute('width') || '519.4');
            dot.setAttribute('cx', String(x + width / 2));
            dot.setAttribute('cy', '357.5');
            dot.setAttribute('r', '3.2');
            dot.setAttribute('opacity', '0');
          }
        }

        function playPowerSwitchDragSound(direction) {
          const ctx = ensureDialAudio();
          if (!ctx) return;
          const now = ctx.currentTime;
          const bufferSize = Math.max(1, Math.floor(ctx.sampleRate * 0.035));
          const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            const fade = 1 - i / bufferSize;
            data[i] = (Math.random() * 2 - 1) * fade;
          }
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          const filter = ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.setValueAtTime(direction >= 0 ? 760 : 690, now);
          filter.Q.setValueAtTime(1.6, now);
          const gain = ctx.createGain();
          gain.gain.setValueAtTime(0.0001, now);
          gain.gain.linearRampToValueAtTime(0.42, now + 0.004);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
          source.connect(filter);
          filter.connect(gain);
          gain.connect(ctx.destination);
          source.start(now);
          source.stop(now + 0.035);
        }

        function switchLeverX(poweredOn) {
          return poweredOn ? POWER_SWITCH_MAX_X : POWER_SWITCH_MIN_X;
        }

        function renderPowerSwitchLever(x, pressed = false) {
          const lever = document.getElementById('powerSwitchLever');
          if (!lever) return;
          lever.setAttribute('transform', `translate(${x},0)${pressed ? ' scale(0.96,0.92)' : ''}`);
        }

        function animatePowerOff() {
          const { overlay, line, dot } = powerEffectElements();
          if (!overlay || !line || !dot) return;
          powerAnimationToken++;
          const token = powerAnimationToken;
          const start = performance.now();
          const x = parseFloat(line.getAttribute('x') || '203.3');
          const width = parseFloat(line.getAttribute('width') || '519.4');
          const centerX = x + width / 2;
          overlay.setAttribute('opacity', '0');
          line.setAttribute('x', x);
          line.setAttribute('width', width);
          line.setAttribute('opacity', '0');
          dot.setAttribute('cx', centerX);
          dot.setAttribute('cy', '357.5');
          dot.setAttribute('r', '3.2');
          dot.setAttribute('opacity', '0');
          if (player) { try { player.pauseVideo(); } catch (err) {} }

          function frame(now) {
            if (token !== powerAnimationToken) return;
            const elapsed = now - start;
            if (elapsed <= 520) {
              const p = elapsed / 520;
              const eased = 1 - Math.pow(1 - p, 2.2);
              overlay.setAttribute('opacity', String(eased * 0.965));
              requestAnimationFrame(frame);
              return;
            }
            if (elapsed <= 610) {
              overlay.setAttribute('opacity', '0.965');
              line.setAttribute('opacity', String((elapsed - 520) / 90));
              requestAnimationFrame(frame);
              return;
            }
            if (elapsed <= 875) {
              const p = (elapsed - 610) / 265;
              const eased = 1 - Math.pow(p, 1.7);
              const lineWidth = Math.max(4, width * eased);
              line.setAttribute('x', String(centerX - lineWidth / 2));
              line.setAttribute('width', String(lineWidth));
              line.setAttribute('opacity', '1');
              requestAnimationFrame(frame);
              return;
            }
            if (elapsed <= 1035) {
              overlay.setAttribute('opacity', '0.985');
              line.setAttribute('x', String(centerX - 1.5));
              line.setAttribute('width', '3');
              line.setAttribute('height', '2');
              line.setAttribute('opacity', '1');
              const p = (elapsed - 875) / 160;
              const eased = 1 - Math.pow(p, 2);
              dot.setAttribute('r', String(2.2 + eased * 2.0));
              dot.setAttribute('opacity', String(0.2 + eased * 0.8));
              requestAnimationFrame(frame);
              return;
            }
            overlay.setAttribute('opacity', '1');
            line.setAttribute('opacity', '0');
            dot.setAttribute('opacity', '0');
          }
          requestAnimationFrame(frame);
        }

        function animatePowerOn() {
          const { overlay, line, dot } = powerEffectElements();
          if (!overlay || !line || !dot) {
            resetPowerEffectOn();
            if (player) { try { player.playVideo(); } catch (err) {} }
            return;
          }
          powerAnimationToken++;
          const token = powerAnimationToken;
          const start = performance.now();
          const x = parseFloat(line.getAttribute('x') || '203.3');
          const width = parseFloat(line.getAttribute('width') || '519.4');
          const centerX = x + width / 2;
          overlay.setAttribute('opacity', '1');
          line.setAttribute('x', String(centerX - 1.5));
          line.setAttribute('width', '3');
          line.setAttribute('height', '2');
          line.setAttribute('opacity', '1');
          dot.setAttribute('cx', centerX);
          dot.setAttribute('cy', '357.5');
          dot.setAttribute('r', '3.2');
          dot.setAttribute('opacity', '1');

          function frame(now) {
            if (token !== powerAnimationToken) return;
            const elapsed = now - start;
            if (elapsed <= 150) {
              const p = elapsed / 150;
              const eased = p * (2 - p);
              const lineWidth = 3 + (width - 3) * eased;
              line.setAttribute('x', String(centerX - lineWidth / 2));
              line.setAttribute('width', String(lineWidth));
              line.setAttribute('opacity', '1');
              dot.setAttribute('opacity', String(1 - eased));
              requestAnimationFrame(frame);
              return;
            }
            if (elapsed <= 430) {
              const p = (elapsed - 150) / 280;
              const eased = 1 - Math.pow(1 - p, 2);
              line.setAttribute('x', String(centerX - width * eased / 2));
              line.setAttribute('width', String(Math.max(3, width * eased)));
              line.setAttribute('opacity', String(Math.max(0, 1 - p)));
              overlay.setAttribute('opacity', String(1 - p * 0.15));
              requestAnimationFrame(frame);
              return;
            }
            if (elapsed <= 720) {
              const p = (elapsed - 430) / 290;
              const eased = p * p * (3 - 2 * p);
              overlay.setAttribute('opacity', String(0.85 * (1 - eased)));
              line.setAttribute('opacity', '0');
              requestAnimationFrame(frame);
              return;
            }
            resetPowerEffectOn();
            if (player && token === powerAnimationToken) {
              try { player.playVideo(); } catch (err) {}
            }
          }
          requestAnimationFrame(frame);
        }

        function setTvPowerState(poweredOn) {
          if (isTvPoweredOn === poweredOn) return;
          isTvPoweredOn = poweredOn;
          renderPowerSwitchLever(switchLeverX(poweredOn));
          if (poweredOn) animatePowerOn();
          else animatePowerOff();
        }

        function powerSwitchCenterScreen() {
          const el = document.getElementById('powerSwitch');
          const ctm = el?.getScreenCTM();
          return ctm ? new DOMPoint(0, 0).matrixTransform(ctm) : null;
        }

        function pointerPowerSwitchX(event) {
          const center = powerSwitchCenterScreen();
          if (!center) return null;
          const p = Math.max(-24, Math.min(24, event.clientX - center.x));
          return (p / 24) * 12;
        }

        function beginPowerDrag(event) {
          const hit = document.getElementById('powerSwitchHitbox');
          if (!hit) return;
          const raw = pointerPowerSwitchX(event);
          if (raw == null) return;
          ensureDialAudio();
          activePowerDrag = {
            pointerId: event.pointerId,
            lastRawX: raw,
            visualX: switchLeverX(isTvPoweredOn),
            movedEnough: false,
            lastTickAt: performance.now()
          };
          hit.setPointerCapture?.(event.pointerId);
          document.getElementById('powerSwitch')?.classList.add('dragging');
          event.preventDefault();
          event.stopPropagation();
        }

        function movePowerDrag(event) {
          if (!activePowerDrag || event.pointerId !== activePowerDrag.pointerId) return;
          const raw = pointerPowerSwitchX(event);
          if (raw == null) return;
          const delta = raw - activePowerDrag.lastRawX;
          activePowerDrag.lastRawX = raw;
          activePowerDrag.visualX = Math.max(POWER_SWITCH_MIN_X, Math.min(POWER_SWITCH_MAX_X, activePowerDrag.visualX + delta / POWER_DRAG_RESISTANCE));
          const pressed = Math.abs(delta) > 0.1;
          renderPowerSwitchLever(activePowerDrag.visualX, pressed);

          const now = performance.now();
          if (Math.abs(delta) > 0.15 && now - activePowerDrag.lastTickAt > 55) {
            playPowerSwitchDragSound(delta >= 0 ? 1 : -1);
            activePowerDrag.lastTickAt = now;
          }
          activePowerDrag.movedEnough = activePowerDrag.movedEnough || Math.abs(activePowerDrag.visualX - switchLeverX(isTvPoweredOn)) > 1.5;
          event.preventDefault();
          event.stopPropagation();
        }

        function endPowerDrag(event) {
          if (!activePowerDrag) return;
          if (event?.pointerId != null && event.pointerId !== activePowerDrag.pointerId) return;
          const drag = activePowerDrag;
          activePowerDrag = null;
          document.getElementById('powerSwitch')?.classList.remove('dragging');
          try { document.getElementById('powerSwitchHitbox')?.releasePointerCapture(event.pointerId); } catch (_) {}

          const changedSide = drag.visualX > 0;
          const targetOn = changedSide;
          renderPowerSwitchLever(switchLeverX(targetOn));
          if (targetOn !== isTvPoweredOn) {
            if (targetOn) {
              playPowerSwitchDragSound(1);
              setTvPowerState(true);
            } else {
              playPowerSwitchDragSound(-1);
              setTvPowerState(false);
            }
          } else {
            // Anahtarı yavaşça eski konumuna geri bırak.
            const startX = drag.visualX;
            const targetX = switchLeverX(isTvPoweredOn);
            const started = performance.now();
            function settle(now) {
              const p = Math.min(1, (now - started) / 180);
              const eased = 1 - Math.pow(1 - p, 3);
              renderPowerSwitchLever(startX + (targetX - startX) * eased);
              if (p < 1) requestAnimationFrame(settle);
            }
            requestAnimationFrame(settle);
          }
          event?.preventDefault?.();
          event?.stopPropagation?.();
        }

        const powerSwitch = document.getElementById('powerSwitch');
        const powerSwitchHitbox = document.getElementById('powerSwitchHitbox');
        if (powerSwitchHitbox) {
          powerSwitchHitbox.addEventListener('pointerdown', beginPowerDrag);
          powerSwitchHitbox.addEventListener('pointermove', movePowerDrag);
          powerSwitchHitbox.addEventListener('pointerup', endPowerDrag);
          powerSwitchHitbox.addEventListener('pointercancel', endPowerDrag);
          powerSwitchHitbox.addEventListener('lostpointercapture', (event) => {
            if (activePowerDrag) endPowerDrag(event);
          });
        }
        renderPowerSwitchLever(switchLeverX(isTvPoweredOn));

        function renderDial(config, rotation) {
          const transform = `rotate(${rotation})`;
          config.face?.setAttribute('transform', transform);
          config.pointer?.setAttribute('transform', transform);
        }
    
        function animateDialTo(config, target) {
          const start = config.rotation;
          const distance = target - start;
          const duration = 85;
          const startTime = performance.now();

          function frame(now) {
            const p = Math.min(1,
              (now - startTime) / duration);
            const eased = 1 - Math.pow(1 - p, 3);
            renderDial(config, start + distance * eased);
            if (p < 1) {
              requestAnimationFrame(frame);
            }
          }
          requestAnimationFrame(frame);
        }
    
        function beginDialDrag(name, event) {
          const config = dialConfigs[name];
          if (!config?.element) return;
          const angle = pointerAngle(config.element, event);
          if (angle == null) return;

          ensureDialAudio();
          activeDial = {
            name,
            config,
            pointerId: event.pointerId,
            lastPointerAngle: angle,
            rawRotation: config.rotation,
            lastDetent: Math.round(config.rotation / config.step)
          };
          config.element.classList.add('dragging');
          try {
            config.element.setPointerCapture(event.pointerId);
          } catch (_) {}
          event.preventDefault();
        }
    
        function moveDialDrag(event) {
          if (!activeDial || event.pointerId !== activeDial.pointerId) {
            return;
          }
          const {
            config
          } = activeDial;
          const angle = pointerAngle(config.element, event);
          if (angle == null) return;
          const RESISTANCE_FACTOR = 3;
          const rawDelta = angleDelta(activeDial.lastPointerAngle, angle);

          activeDial.rawRotation += (rawDelta / RESISTANCE_FACTOR);
          activeDial.lastPointerAngle = angle;

          const newDetent = Math.round(activeDial.rawRotation / config.step);
          const snappedRotation = newDetent * config.step;
     
          if (newDetent !== activeDial.lastDetent) {
      
          hasDialBeenMoved = true;

          playMechanicalTick(newDetent > activeDial.lastDetent ? 1 : -1);
          changeChannel(newDetent);

          activeDial.lastDetent = newDetent;
        }

        config.rotation = snappedRotation;
        renderDial(config, snappedRotation);
        event.preventDefault();
      }



      function endDialDrag(event) {
        if (!activeDial) return;
        if (event?.pointerId != null && event.pointerId !== activeDial.pointerId) {
          return;
        }
        const {
          config
        } = activeDial;
        const target = Math.round(config.rotation / config.step) * config.step;
        config.rotation = target;
        animateDialTo(config, target);
        config.element.classList.remove('dragging');
        try {
          if (event?.pointerId != null) {
            config.element.releasePointerCapture(event.pointerId);
          }
        } catch (_) {}
        activeDial = null;
      }
 
      Object.entries(dialConfigs).forEach(
        ([name, config]) => {
          if (!config.element) return;
          config.element.addEventListener('pointerdown',
            (event) => {
              beginDialDrag(name, event);
            });
          config.element.addEventListener('pointermove', moveDialDrag);
          config.element.addEventListener('pointerup', endDialDrag);
          config.element.addEventListener('pointercancel', endDialDrag);
          config.element.addEventListener('lostpointercapture',
            () => {
              if (activeDial?.name === name) {
                endDialDrag();
              }
            });
        });

      renderDial(dialConfigs.vhf, dialConfigs.vhf.rotation);
      renderDial(dialConfigs.uhf, dialConfigs.uhf.rotation);
    </script>
  </body>
