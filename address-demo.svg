<?xml version="1.0" encoding="utf-8"?>
<svg id="tipSvg" viewBox="0 0 662 215" xmlns="http://www.w3.org/2000/svg" width="662" height="215">
  <defs>
    <style>
      /* <![CDATA[ */
      /* --- TAB ICONS --- */
      @keyframes ytTabIconAnim {
        0%, 55% { opacity: 1; }
        56%, 96% { opacity: 0; }
        97%, 100% { opacity: 1; }
      }
      @keyframes tvTabIconAnim {
        0%, 55% { opacity: 0; }
        56%, 95% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      /* --- TAB TITLES --- */
      @keyframes tabYtTitleAnim {
        0%, 55% { opacity: 1; }
        56%, 96% { opacity: 0; }
        97%, 100% { opacity: 1; }
      }
      @keyframes tabRetroTitleAnim {
        0%, 55% { opacity: 0; }
        56%, 95% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      /* --- CHROME PROGRESS BAR --- */
      @keyframes chromeLoadingBarAnim {
        0%, 52% { opacity: 0; width: 0px; }
        53% { opacity: 1; width: 40px; }
        58% { opacity: 1; width: 280px; }
        64% { opacity: 1; width: 438px; }
        66% { opacity: 0; width: 438px; }
        67%, 100% { opacity: 0; width: 0px; }
      }

      /* --- RELOAD ICON ROTATION ON ENTER --- */
      @keyframes reloadIconRotateAnim {
        0%, 52% { transform: rotate(0deg); }
        53%, 65% { transform: rotate(360deg); }
        66%, 100% { transform: rotate(0deg); }
      }

      /* --- SELECTION AND DOMAIN ANIMATIONS --- */
      @keyframes selectAnim {
        0%, 10% { opacity: 0; }
        11%, 19% { opacity: 1; }
        20%, 100% { opacity: 0; }
      }
      @keyframes ytTextAnim {
        0%, 19% { opacity: 1; }
        20%, 96% { opacity: 0; }
        97%, 100% { opacity: 1; }
      }
      @keyframes retroTextAnim {
        0%, 19% { opacity: 0; }
        20%, 95% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      /* --- TYPING CLIP AND CURSOR --- */
      @keyframes clipWidthAnim {
        0%, 20% { width: 0px; }
        21% { width: 5px; }
        22.5% { width: 13px; }
        24% { width: 19px; }
        25.5% { width: 27px; }
        27% { width: 31px; }
        28.5% { width: 37px; }
        30% { width: 46px; }
        31.5% { width: 50px; }
        33% { width: 59px; }
        34.5% { width: 63px; }
        36% { width: 68px; }
        37.5% { width: 77px; }
        39% { width: 85px; }
        40.5% { width: 94px; }
        42% { width: 98px; }
        43.5% { width: 103px; }
        45%, 95% { width: 125px; }
        96%, 100% { width: 0px; }
      }

      @keyframes cursorAnim {
        0%, 19% { opacity: 0; transform: translateX(0px); }
        20% { opacity: 1; transform: translateX(0px); }
        21% { opacity: 1; transform: translateX(5px); }
        22.5% { opacity: 1; transform: translateX(13px); }
        24% { opacity: 1; transform: translateX(19px); }
        25.5% { opacity: 1; transform: translateX(27px); }
        27% { opacity: 1; transform: translateX(31px); }
        28.5% { opacity: 1; transform: translateX(37px); }
        30% { opacity: 1; transform: translateX(46px); }
        31.5% { opacity: 1; transform: translateX(50px); }
        33% { opacity: 1; transform: translateX(59px); }
        34.5% { opacity: 1; transform: translateX(63px); }
        36% { opacity: 1; transform: translateX(68px); }
        37.5% { opacity: 1; transform: translateX(77px); }
        39% { opacity: 1; transform: translateX(85px); }
        40.5% { opacity: 1; transform: translateX(94px); }
        42% { opacity: 1; transform: translateX(98px); }
        43.5% { opacity: 1; transform: translateX(103px); }
        45% { opacity: 1; transform: translateX(112px); }
        47% { opacity: 0; transform: translateX(112px); }
        49% { opacity: 1; transform: translateX(112px); }
        51% { opacity: 0; transform: translateX(112px); }
        52%, 100% { opacity: 0; transform: translateX(0px); }
      }

      @keyframes pathFollowAnim {
        0%, 19% { transform: translateX(0px); }
        20% { transform: translateX(-118px); }
        21% { transform: translateX(-113px); }
        22.5% { transform: translateX(-105px); }
        24% { transform: translateX(-99px); }
        25.5% { transform: translateX(-91px); }
        27% { transform: translateX(-87px); }
        28.5% { transform: translateX(-81px); }
        30% { transform: translateX(-72px); }
        31.5% { transform: translateX(-68px); }
        33% { transform: translateX(-59px); }
        34.5% { transform: translateX(-55px); }
        36% { transform: translateX(-50px); }
        37.5% { transform: translateX(-41px); }
        39% { transform: translateX(-33px); }
        40.5% { transform: translateX(-24px); }
        42% { transform: translateX(-20px); }
        43.5% { transform: translateX(-15px); }
        45%, 95% { transform: translateX(-6.5px); }
        96%, 100% { transform: translateX(0px); }
      }

      /* --- BOTTOM STEP GUIDES --- */
      @keyframes step1Anim {
        0%, 10% { opacity: 1; }
        11%, 100% { opacity: 0; }
      }
      @keyframes step2Anim {
        0%, 10% { opacity: 0; }
        11%, 44% { opacity: 1; }
        45%, 100% { opacity: 0; }
      }
      @keyframes step3Anim {
        0%, 44% { opacity: 0; }
        45%, 52% { opacity: 1; }
        53%, 100% { opacity: 0; }
      }
      @keyframes step4Anim {
        0%, 52% { opacity: 0; }
        53%, 64% { opacity: 1; }
        65%, 100% { opacity: 0; }
      }
      @keyframes step5Anim {
        0%, 64% { opacity: 0; }
        65%, 95% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      /* --- SOFT LOOP FADE TRANSITION --- */
      @keyframes sceneLoopAnim {
        0%, 95% { opacity: 1; }
        96.5% { opacity: 0.15; }
        98%, 100% { opacity: 1; }
      }

      .scene-content { animation: sceneLoopAnim 11s infinite; }
      .tab-yt-icon { animation: ytTabIconAnim 11s infinite; }
      .tab-tv-icon { animation: tvTabIconAnim 11s infinite; opacity: 0; }
      .tab-yt-title { animation: tabYtTitleAnim 11s infinite; }
      .tab-retro-title { animation: tabRetroTitleAnim 11s infinite; opacity: 0; }
      .chrome-progress { animation: chromeLoadingBarAnim 11s infinite; opacity: 0; }
      .reload-icon-group { animation: reloadIconRotateAnim 11s infinite; transform-origin: 114px 63px; }

      .selection-rect { animation: selectAnim 11s infinite; }
      .yt-domain { animation: ytTextAnim 11s infinite; }
      .retro-domain { animation: retroTextAnim 11s infinite; }
      .clip-rect { animation: clipWidthAnim 11s infinite; }
      .cursor-line { animation: cursorAnim 11s infinite; }
      .follow-group { animation: pathFollowAnim 11s infinite; }

      .step-1 { animation: step1Anim 11s infinite; }
      .step-2 { animation: step2Anim 11s infinite; }
      .step-3 { animation: step3Anim 11s infinite; }
      .step-4 { animation: step4Anim 11s infinite; }
      .step-5 { animation: step5Anim 11s infinite; }
      /* ]]> */
    </style>

    <clipPath id="retroTypeClip">
      <rect class="clip-rect" x="297.5" y="50" width="0" height="35" />
    </clipPath>

    <!-- Tab title clip so it fits inside Chrome tab before the close button -->
    <clipPath id="tabTitleClip">
      <rect x="39" y="10" width="170" height="25" />
    </clipPath>
  </defs>

  <g class="scene-content">
    <!-- Container Box with Border and Shadow -->
    <rect x="0.5" y="0.5" width="661" height="214" rx="10" fill="#ffffff" stroke="#aeb5bf" stroke-width="1"/>

    <!-- Chrome Header Tabs Background -->
    <rect x="1" y="1" width="660" height="40" rx="9" fill="#d8e7fb"/>
    <rect x="1" y="25" width="660" height="16" fill="#d8e7fb"/>
    
    <!-- Active Chrome Tab Shape -->
    <path d="M 0 40 C 8 40 11 34 11 26 L 11.378 17.697 C 11.907 9.243 11.176 4.741 20.176 4.741 L 226.007 4.057 C 238.007 4.057 237.967 7.651 238.496 19.651 L 238.835 27 C 238.835 35 246 40 255 40 L 0 40 Z" fill="#fff"/>

    <!-- 1. TAB FAVICON: YouTube (Red rounded play button) -->
    <g class="tab-yt-icon">
      <rect x="18" y="14" width="16" height="12" rx="3.5" fill="#ff0000"/>
      <polygon points="24,17.2 24,22.8 28.5,20" fill="#ffffff"/>
    </g>

    <!-- 2. TAB FAVICON: Retro TV Icon (from tv.ico / brand-mark) -->
    <g class="tab-tv-icon" transform="translate(18, 12)" opacity="0">
      <!-- Antenna -->
      <path d="M4.5 1L8 4L11.5 1" fill="none" stroke="#626454" stroke-width="1.2" stroke-linecap="round"/>
      <!-- TV Cabinet -->
      <rect x="1.5" y="4" width="13" height="10" rx="2.5" fill="#994023" stroke="#80321c" stroke-width="0.8"/>
      <!-- Screen CRT Glass -->
      <rect x="3.5" y="6" width="7" height="6" rx="1.5" fill="#181b17"/>
      <!-- Analog Control Knobs -->
      <circle cx="12.2" cy="7" r="0.6" fill="#e9e1cd"/>
      <circle cx="12.2" cy="9.5" r="0.6" fill="#e9e1cd"/>
      <!-- Legs -->
      <path d="M4 14v1M12 14v1" stroke="#626454" stroke-width="1.2" stroke-linecap="round"/>
    </g>

    <!-- TAB TITLES (Clipped gracefully before close button) -->
    <g clip-path="url(#tabTitleClip)" font-family="Arial,Helvetica,sans-serif" font-size="12">
      <!-- Title 1: YouTube -->
      <text class="tab-yt-title" x="40" y="24" fill="#202124" font-weight="500">YouTube</text>

      <!-- Title 2: Watch the YouTube video on Retro TV -->
      <text class="tab-retro-title" x="40" y="24" fill="#202124" font-weight="600" opacity="0">Watch the YouTube video on &quot;Retro TV&quot;</text>
    </g>

    <!-- Tab Close and New Tab Buttons -->
    <g fill="none" stroke="#3c4043" stroke-width="2" stroke-linecap="round">
      <path transform="translate(-4 0)" d="M219 16l9 9m0-9-9 9"/>
      <path d="M259 20h11m-5.5-5.5v11"/>
    </g>

    <!-- Navigation Bar Area -->
    <rect y="40" width="662" height="66" fill="#fff"/>
    <g fill="none" stroke="#5f6368" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
      <path d="M31 61l-8 8 8 8M23 69h17" opacity=".55"/>
      <path d="M67 61l8 8-8 8M75 69H58" opacity=".55"/>
    </g>
    <!-- Reload Button -->
    <g class="reload-icon-group" transform="translate(106.7 55.7) scale(1.33)" fill="#5f6368">
      <path d="M10 16c-1.668 0-3.082-.582-4.25-1.75C4.582 13.082 4 11.668 4 10c0-1.668.582-3.082 1.75-4.25C6.918 4.582 8.332 4 10 4a5.68 5.68 0 0 1 2.512.563c.77.375 1.433.875 1.988 1.5V4H16v5h-5V7.5h2.73a4.443 4.443 0 0 0-1.585-1.457A4.332 4.332 0 0 0 10 5.5c-1.25 0-2.313.438-3.188 1.313S5.5 8.75 5.5 10c0 1.25.438 2.313 1.313 3.188C7.688 14.062 8.75 14.5 10 14.5c1.168 0 2.168-.387 3-1.156a4.425 4.425 0 0 0 1.438-2.844h1.542c-.125 1.555-.757 2.86-1.898 3.918C12.945 15.473 11.582 16 10 16Z"/>
    </g>
    <g transform="translate(158 59) scale(.04)" fill="none" stroke="#5f6368" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
      <path d="M48 208L232 47Q256 26 280 47L464 208"/>
      <path d="M80 190V430Q80 464 114 464H398Q432 464 432 430V190"/>
    </g>

    <!-- URL Address Capsule Bar -->
    <rect id="addressRect" x="204" y="47" width="438" height="44" rx="22" fill="#eef3fb"/>

    <!-- Chrome Address Bar Loading Progress Line (slides across when enter is pressed) -->
    <g clip-path="url(#addressBarClip)">
      <rect class="chrome-progress" x="204" y="88.5" width="0" height="2.5" fill="#1a73e8" opacity="0"/>
    </g>
    <clipPath id="addressBarClip">
      <rect x="204" y="47" width="438" height="44" rx="22"/>
    </clipPath>

    <!-- Google 'G' / Search Icon inside Address Bar -->
    <g transform="translate(217.2 79) scale(.02)" fill="#5f6368">
      <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q76 0 143.5 26.5T748-776L634-665q-31-29-70.5-44.5T480-725q-100 0-170 71.5T240-480q0 102 70 173.5T480-235q85 0 146.5-47.5T700-404H480v-149h374q5 23 7.5 41.5T864-471q0 175-106 283T480-80Z"/>
    </g>

    <!-- URL Address Content -->
    <g font-family="Arial,Helvetica,sans-serif" font-size="14.5">
      <!-- Prefix: https:// (Ends exactly at x=297.5) -->
      <text id="demoPrefix" x="254" y="74.5" fill="#80868b">https://</text>

      <!-- Selection Highlight Box over www.youtube.com (Starts at 297.5, width 118) -->
      <rect class="selection-rect" x="297.5" y="56" width="118" height="25" rx="2" fill="#aecbfa" opacity="0"/>

      <!-- YouTube Domain Text -->
      <text class="yt-domain" x="297.5" y="74.5" fill="#202124">www.youtube.com</text>

      <!-- Retro TV Replacement Domain Text (Clipped for typewriter typing) -->
      <g clip-path="url(#retroTypeClip)">
        <text class="retro-domain" x="297.5" y="74.5" fill="#994023" font-weight="600">tvretro.github.io</text>
      </g>

      <!-- Typing Cursor -->
      <path class="cursor-line" d="M297.5 56v24" stroke="#1a73e8" stroke-width="1.5" opacity="0"/>

      <!-- Fixed Video Path and Bracket Group -->
      <g class="follow-group">
        <text id="fixedVideoPath" x="415.5" y="74.5" fill="#3c4043">/watch?v=XEjLoHdbVeE</text>
        <path id="pathBracket" d="M415.5 115v8H577v-8" fill="none" stroke="#6f815e" stroke-width="1.2"/>
        <text id="pathNote" x="496" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#526144">Keep this part unchanged</text>
      </g>
    </g>

    <!-- Step Instruction Bar at the Bottom -->
    <g font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold">
      <text class="step-1" x="24" y="194" fill="#74452f">1. Select the website name (www.youtube.com)</text>
      <text class="step-2" x="24" y="194" fill="#74452f" opacity="0">2. Replace it with tvretro.github.io</text>
      <text class="step-3" x="24" y="194" fill="#1a73e8" opacity="0">3. Press Enter to open in Retro TV</text>
      <text class="step-4" x="24" y="194" fill="#1a73e8" opacity="0">Connecting to Retro TV...</text>
      <text class="step-5" x="24" y="194" fill="#2e7d32" opacity="0">Loaded! The video opens inside Retro TV.</text>
    </g>
  </g>
</svg>
