<?xml version="1.0" encoding="utf-8"?>
<svg id="tipSvg" viewBox="0 0 662 215" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <defs>
    <style>
      @keyframes selectAnim {
        0%, 12% { opacity: 0; }
        16%, 27% { opacity: 1; }
        28%, 100% { opacity: 0; }
      }

      @keyframes ytTextAnim {
        0%, 27% { opacity: 1; }
        28%, 100% { opacity: 0; }
      }

      @keyframes retroTextAnim {
        0%, 27% { opacity: 0; }
        28%, 95% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      @keyframes clipWidthAnim {
        0%, 28% { width: 0px; }
        30% { width: 5px; }
        32% { width: 13px; }
        34% { width: 19px; }
        36% { width: 27px; }
        38% { width: 31px; }
        40% { width: 37px; }
        42% { width: 46px; }
        44% { width: 50px; }
        46% { width: 59px; }
        48% { width: 63px; }
        50% { width: 68px; }
        52% { width: 77px; }
        54% { width: 85px; }
        56% { width: 94px; }
        58% { width: 98px; }
        60% { width: 103px; }
        62%, 95% { width: 125px; }
        96%, 100% { width: 0px; }
      }

      @keyframes cursorAnim {
        0%, 27% { opacity: 0; transform: translateX(0px); }
        28% { opacity: 1; transform: translateX(0px); }
        30% { opacity: 1; transform: translateX(5px); }
        32% { opacity: 1; transform: translateX(13px); }
        34% { opacity: 1; transform: translateX(19px); }
        36% { opacity: 1; transform: translateX(27px); }
        38% { opacity: 1; transform: translateX(31px); }
        40% { opacity: 1; transform: translateX(37px); }
        42% { opacity: 1; transform: translateX(46px); }
        44% { opacity: 1; transform: translateX(50px); }
        46% { opacity: 1; transform: translateX(59px); }
        48% { opacity: 1; transform: translateX(63px); }
        50% { opacity: 1; transform: translateX(68px); }
        52% { opacity: 1; transform: translateX(77px); }
        54% { opacity: 1; transform: translateX(85px); }
        56% { opacity: 1; transform: translateX(94px); }
        58% { opacity: 1; transform: translateX(98px); }
        60% { opacity: 1; transform: translateX(103px); }
        62% { opacity: 1; transform: translateX(112px); }
        65%, 85% { opacity: 0; transform: translateX(112px); }
        86%, 94% { opacity: 1; transform: translateX(112px); }
        95%, 100% { opacity: 0; transform: translateX(0px); }
      }

      @keyframes pathFollowAnim {
        0%, 27% { transform: translateX(0px); }
        28% { transform: translateX(-118px); }
        30% { transform: translateX(-113px); }
        32% { transform: translateX(-105px); }
        34% { transform: translateX(-99px); }
        36% { transform: translateX(-91px); }
        38% { transform: translateX(-87px); }
        40% { transform: translateX(-81px); }
        42% { transform: translateX(-72px); }
        44% { transform: translateX(-68px); }
        46% { transform: translateX(-59px); }
        48% { transform: translateX(-55px); }
        50% { transform: translateX(-50px); }
        52% { transform: translateX(-41px); }
        54% { transform: translateX(-33px); }
        56% { transform: translateX(-24px); }
        58% { transform: translateX(-20px); }
        60% { transform: translateX(-15px); }
        62%, 95% { transform: translateX(-6.5px); }
        96%, 100% { transform: translateX(0px); }
      }

      @keyframes step1Anim {
        0%, 15% { opacity: 1; }
        16%, 100% { opacity: 0; }
      }
      @keyframes step2Anim {
        0%, 15% { opacity: 0; }
        16%, 61% { opacity: 1; }
        62%, 100% { opacity: 0; }
      }
      @keyframes step3Anim {
        0%, 61% { opacity: 0; }
        62%, 95% { opacity: 1; }
        96%, 100% { opacity: 0; }
      }

      .selection-rect {
        animation: selectAnim 8s infinite;
      }
      .yt-domain {
        animation: ytTextAnim 8s infinite;
      }
      .retro-domain {
        animation: retroTextAnim 8s infinite;
      }
      .clip-rect {
        animation: clipWidthAnim 8s infinite;
      }
      .cursor-line {
        animation: cursorAnim 8s infinite;
      }
      .follow-group {
        animation: pathFollowAnim 8s infinite;
      }
      .step-1 { animation: step1Anim 8s infinite; }
      .step-2 { animation: step2Anim 8s infinite; }
      .step-3 { animation: step3Anim 8s infinite; }
    </style>

    <clipPath id="retroTypeClip">
      <rect class="clip-rect" x="297.5" y="50" width="0" height="35" />
    </clipPath>
  </defs>

  <!-- Container Box with Border & Shadow -->
  <rect x="0.5" y="0.5" width="661" height="214" rx="10" fill="#ffffff" stroke="#aeb5bf" stroke-width="1"/>

  <!-- Chrome Header Tabs -->
  <rect x="1" y="1" width="660" height="40" rx="9" fill="#d8e7fb"/>
  <rect x="1" y="25" width="660" height="16" fill="#d8e7fb"/>
