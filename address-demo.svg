  <!-- Chrome Logo inside Tab -->
  <g transform="translate(18 12) scale(.032)" fill="#202124">
    <path d="M188.8,255.93A67.2,67.2,0,1,0,256,188.75,67.38,67.38,0,0,0,188.8,255.93Z"/>
    <path d="M476.75,217.79s0,0,0,.05a206.63,206.63,0,0,0-7-28.84h-.11a202.16,202.16,0,0,1,7.07,29h0a203.5,203.5,0,0,0-7.07-29H314.24c19.05,17,31.36,40.17,31.36,67.05a86.55,86.55,0,0,1-12.31,44.73L231,478.45a2.44,2.44,0,0,1,0,.27V479h0v-.26A224,224,0,0,0,256,480c6.84,0,13.61-.39,20.3-1a222.91,222.91,0,0,0,29.78-4.74C405.68,451.52,480,362.4,480,255.94A225.25,225.25,0,0,0,476.75,217.79Z"/>
    <path d="M256,345.5c-33.6,0-61.6-17.91-77.29-44.79L76,123.05l-.14-.24A224,224,0,0,0,207.4,474.55l0-.05,77.69-134.6A84.13,84.13,0,0,1,256,345.5Z"/>
    <path d="M91.29,104.57l77.35,133.25A89.19,89.19,0,0,1,256,166H461.17a246.51,246.51,0,0,0-25.78-43.94l.12.08A245.26,245.26,0,0,1,461.17,166h.17a245.91,245.91,0,0,0-25.66-44,2.63,2.63,0,0,1-.35-.26A223.93,223.93,0,0,0,91.14,104.34l.14.24Z"/>
  </g>
  <text x="42" y="27" font-family="Arial,Helvetica,sans-serif" font-size="13" fill="#202124">New Tab</text>
  <g fill="none" stroke="#3c4043" stroke-width="2" stroke-linecap="round">
    <path transform="translate(-4 0)" d="M219 16l9 9m0-9-9 9"/>
    <path d="M259 20h11m-5.5-5.5v11"/>
  </g>

  <!-- Navigation Bar Area -->
  <rect y="40" width="662" height="66" fill="#fff"/>
  <g fill="none" stroke="#5f6368" stroke-width="2.15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M31 61l-8 8 8 8M23 69h17" opacity=".55"/>
    <path d="M67 61l8 8-8 8M75 69H58" opacity=".55"/>
  </g>
  <g transform="translate(106.7 55.7) scale(1.33)" fill="#5f6368">
    <path d="M10 16c-1.668 0-3.082-.582-4.25-1.75C4.582 13.082 4 11.668 4 10c0-1.668.582-3.082 1.75-4.25C6.918 4.582 8.332 4 10 4a5.68 5.68 0 0 1 2.512.563c.77.375 1.433.875 1.988 1.5V4H16v5h-5V7.5h2.73a4.443 4.443 0 0 0-1.585-1.457A4.332 4.332 0 0 0 10 5.5c-1.25 0-2.313.438-3.188 1.313S5.5 8.75 5.5 10c0 1.25.438 2.313 1.313 3.188C7.688 14.062 8.75 14.5 10 14.5c1.168 0 2.168-.387 3-1.156a4.425 4.425 0 0 0 1.438-2.844h1.542c-.125 1.555-.757 2.86-1.898 3.918C12.945 15.473 11.582 16 10 16Z"/>
  </g>
  <g transform="translate(158 59) scale(.04)" fill="none" stroke="#5f6368" stroke-width="44" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 208L232 47Q256 26 280 47L464 208"/>
    <path d="M80 190V430Q80 464 114 464H398Q432 464 432 430V190"/>
  </g>

  <!-- URL Address Capsule Bar -->
  <rect id="addressRect" x="204" y="47" width="438" height="44" rx="22" fill="#eef3fb"/>
  <g transform="translate(217.2 79) scale(.02)" fill="#5f6368">
    <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q76 0 143.5 26.5T748-776L634-665q-31-29-70.5-44.5T480-725q-100 0-170 71.5T240-480q0 102 70 173.5T480-235q85 0 146.5-47.5T700-404H480v-149h374q5 23 7.5 41.5T864-471q0 175-106 283T480-80Z"/>
  </g>

  <!-- URL Address Content -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="14.5">
    <!-- Prefix: https:// (Ends exactly at x=297.5) -->
    <text id="demoPrefix" x="254" y="74.5" fill="#80868b">https://</text>

    <!-- Selection Highlight Box over www.youtube.com (Starts exactly at x=297.5, width=118) -->
    <rect class="selection-rect" x="297.5" y="56" width="118" height="25" rx="2" fill="#aecbfa" opacity="0"/>

    <!-- YouTube Domain Text (Starts seamlessly right after https://) -->
    <text class="yt-domain" x="297.5" y="74.5" fill="#202124">www.youtube.com</text>

    <!-- Retro TV Replacement Domain Text (Starts seamlessly right after https://) -->
    <g clip-path="url(#retroTypeClip)">
      <text class="retro-domain" x="297.5" y="74.5" fill="#994023" font-weight="600">tvretro.github.io</text>
    </g>

    <!-- Typing Cursor -->
    <path class="cursor-line" d="M297.5 56v24" stroke="#1a73e8" stroke-width="1.5" opacity="0"/>

    <!-- Fixed Video Path & Bracket Group -->
    <g class="follow-group">
      <text id="fixedVideoPath" x="415.5" y="74.5" fill="#3c4043">/watch?v=XEjLoHdbVeE</text>
      <path id="pathBracket" d="M415.5 115v8H577v-8" fill="none" stroke="#6f815e" stroke-width="1.2"/>
      <text id="pathNote" x="496" y="142" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#526144">Keep this part unchanged</text>
    </g>
  </g>

  <!-- Step Instruction Bar at the Bottom -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="13.5" font-weight="bold">
    <text class="step-1" x="24" y="194" fill="#74452f">1. Select the website name (www.youtube.com)</text>
    <text class="step-2" x="24" y="194" fill="#74452f" opacity="0">2. Replace it with tvretro.github.io</text>
    <text class="step-3" x="24" y="194" fill="#74452f" opacity="0">3. Press Enter — the same video opens in Retro TV.</text>
  </g>
</svg>
